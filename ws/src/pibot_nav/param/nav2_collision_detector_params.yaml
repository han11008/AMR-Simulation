collision_detector:
  ros__parameters:
    use_sim_time: True
    frequency: 10.0
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    transform_tolerance: 0.5
    source_timeout: 0.0
    polygons: ["PolygonLeftFront", "PolygonRightFront", "PolygonLeftBack", "PolygonRightBack"]
    PolygonLeftFront:
      enabled: True
      type: "polygon"
      points: [0.2, 0.21, 0.2, 0.0, 0.0, 0.0, 0.0, 0.21]
      action_type: "none"
      visualize: True
      polygon_pub_topic: "polygon_left_front"
    PolygonRightFront:
      enabled: True
      type: "polygon"
      points: [0.2, -0.21, 0.2, 0.0, 0.0, 0.0, 0.0, -0.21]
      action_type: "none"
      visualize: True
      polygon_pub_topic: "polygon_right_front"
    PolygonLeftBack:
      enabled: True
      type: "polygon"
      points: [0.0, 0.21, 0.0, -0.05, -0.35, -0.05, -0.35, 0.22]
      action_type: "none"
      visualize: True
      polygon_pub_topic: "polygon_left_back"
    PolygonRightBack:
      enabled: True
      type: "polygon"
      points: [0.0, -0.21, 0.0, 0.05, -0.35, 0.05, -0.35, -0.22]
      action_type: "none"
      visualize: True
      polygon_pub_topic: "polygon_right_back"
    observation_sources: ["scan"]
    scan:
      enabled: True
      type: scan
      topic: scan
      source_timeout: 0.0 # set 0.0 to disable timeout warning
#    range:
#      enabled: True
#      type: range
#      topic: /range
#      source_timeout: 0.0

