controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    transform_tolerance: 2.0
    min_x_velocity_threshold: 0.1
    min_theta_velocity_threshold: 0.7
    failure_tolerance: 0.0 # maximum duration in seconds before fail
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    ### Checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      trans_stopped_velocity: 0.24
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.1416
      stateful: True
    ### DWB parameters
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      iteration_count: 1
      batch_size: 500
      time_steps: 56
      model_dt: 0.2
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.6
      vx_max: 0.24
      vx_min: 0.0 # -0.24
      vy_max: 0.0
      wz_max: 1.2
      temperature: 0.3 # selectiveness of trajectories by their costs
      gamma: 0.015
      prune_distance: 2.0
      transform_tolerance: 2.0
      visualize: False
      retry_attempt_limit: 2
      regenerate_noises: True
      critics: [ConstraintCritic, CostCritic, GoalCritic,
        PathAlignCritic, PathAngleCritic, PathFollowCritic]
      ConstraintCritic:
        enabled: True
        cost_power: 1
        cost_weight: 4.0
#      ObstaclesCritic:
#        enabled: True
#        cost_power: 1
#        repulsion_weight: 0.8 # preferring routes in lower cost space
#        critical_weight: 20.0
#        consider_footprint: False
#        collision_cost: 1000000.0
#        collision_margin_distance: 0.2
#        near_goal_distance: 0.5 # stop apply preferential obstacle term to smoothly converge to goal
#        cost_scaling_factor: 3.8 # humble only
#        inflation_radius: 3.0 # humble only
      CostCritic:
        enabled: True
        cost_power: 1
        cost_weight: 3.81
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 0.5
        trajectory_point_step: 5 # step to take in trajectory for evaluating
      GoalCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.8 # minimal distance in meters between robot and goal, wise to be same as prediction horizon
      PathAlignCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.05 # maximum proportion that can be occupied by obstacles
        trajectory_point_step: 3
        threshold_to_consider: 0.5 # distance in meters between robot and goal to stop and allow GoalCritic to take over
        offset_from_furthest: 16 # checks the candidate trajectories are sufficiently far
        use_path_orientations: False # keep False for Navfn planner
      PathAngleCritic:
        enabled: True
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5 # distance in meters between robot and goal to stop and allow GoalCritic to take over
        max_angle_to_furthest: 0.52
        forward_preference: True
      PathFollowCritic:
        enabled: True
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 0.8 # minimal distance in meters between robot and goal, wise to be same as prediction horizon

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: True
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[ [0.08, 0.18], [0.08, -0.18], [-0.32, -0.18], [-0.32, 0.18] ]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.8
        inflation_radius: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          source_timeout: 0.0
      filters: ["keepout_filter", "keepout_inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: /costmap_filter_info
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.8
        inflation_radius: 3.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 2.0
      map_topic: /map
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[ [0.08, 0.18], [0.08, -0.18], [-0.32, -0.18], [-0.32, 0.18] ]"
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.15
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          source_timeout: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        transform_tolerance: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.8
        inflation_radius: 3.0
      filters: ["keepout_filter", "keepout_inflation_layer"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: /costmap_filter_info
      keepout_inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.8
        inflation_radius: 3.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: False
    transform_tolerance: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1 # tolerance in meters between the goal and the end of planned path
      use_astar: False
      allow_unknown: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 2.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.0
    rotational_acc_lim: 1.2

