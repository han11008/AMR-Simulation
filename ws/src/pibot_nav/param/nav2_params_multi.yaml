amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.005 # expected process noise in odometry's rotation estimate from rotaion
    alpha2: 0.005 # expected process noise in odometry's rotation estimate from translation
    alpha3: 0.005 # expected process noise in odometry's translation estimate from translation
    alpha4: 0.005 # expected process noise in odometry's translation estimate from rotation
    alpha5: 0.2 # translation noise for Omni models
    base_frame_id: base_footprint
    do_beamskip: False # whether to ignore beams that most particles disagree with the map
#    beam_skip_distance: 0.5
#    beam_skip_error_threshold: 0.9
#    beam_skip_threshold: 0.3
    global_frame_id: map
    laser_likelihood_max_dist: 4.0 # maximum distance to do obstacle inflation on the map for likelihood_field model
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.01 # particle filter population error
    pf_z: 0.99 # particle filter population density(2.33 is 99%)
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    tf_broadcast: True
    transform_tolerance: 1.0
    update_min_a: 0.01 # rotational movement required before filter upadtes
    update_min_d: 0.1 # translational movement required before filter upadtes
    sigma_hit: 0.15 # standard deviation used in z_hit
    z_hit: 0.8 # weight of matching scan and map, used in likelihood_field model and beam model
    z_rand: 0.2 # weight of random sampling, used in likelihood_field model and beam model
#    z_max: 0.05 # used in beam model
#    z_short: 0.05 # used in beam model
#    lambda_short: 0.1 # exponential decay for z_short
    scan_topic: scan
    map_topic: /map
    set_initial_pose: True
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.yaw: 0.0

